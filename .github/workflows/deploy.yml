name: Build And Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
    env:
      DEPLOY_ENV_FILE: /home/orci/orci-dodoso/.env
      FRONTEND_CONTAINER_NAME: orci-dodoso_frontend_1
      FRONTEND_CONTAINER_MATCH: orci-dodoso_frontend
      PRODUCTION_NETWORK_NAME: orci-dodoso_default
      DJANGO_STATIC_VOLUME_NAME: orci-dodoso_static_volume
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_ENV_FILE}" ]; then
            echo "DEPLOY_ENV_FILE is required."
            exit 1
          fi
          if [ ! -f "${DEPLOY_ENV_FILE}" ]; then
            echo "Deployment env file not found at ${DEPLOY_ENV_FILE}."
            exit 1
          fi
          docker network inspect "${PRODUCTION_NETWORK_NAME}" >/dev/null
          docker volume inspect "${DJANGO_STATIC_VOLUME_NAME}" >/dev/null

      - name: Compute image tags
        id: image
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(printf '%s' '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          sha_tag="$(printf '%s' '${{ github.sha }}' | cut -c1-7)"
          echo "name=ghcr.io/${owner}/${repo}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${sha_tag}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          set -euo pipefail
          docker build \
            -t "${{ steps.image.outputs.name }}:main" \
            -t "${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}" \
            .

      - name: Push image
        run: |
          set -euo pipefail
          docker push "${{ steps.image.outputs.name }}:main"
          docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}"

      - name: Deploy frontend
        run: |
          set -euo pipefail
          docker pull "${{ steps.image.outputs.name }}:main"

          existing_containers="$(docker ps -a --format '{{.Names}}' | grep "${FRONTEND_CONTAINER_MATCH}" || true)"
          if [ -n "${existing_containers}" ]; then
            printf '%s\n' "${existing_containers}" | while IFS= read -r container_name; do
              docker rm -f "${container_name}"
            done
          fi

          docker run -d \
            --name "${FRONTEND_CONTAINER_NAME}" \
            --restart always \
            --network "${PRODUCTION_NETWORK_NAME}" \
            -p 80:80 \
            -v "${DJANGO_STATIC_VOLUME_NAME}:/app/static_collected" \
            "${{ steps.image.outputs.name }}:main"

          docker ps --filter "name=${FRONTEND_CONTAINER_NAME}"

      - name: Cleanup dangling images
        run: docker image prune -f
